<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuCheck — AI 분석 중</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .analyzing__visual svg { animation: spin 2.2s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .analyzing__visual svg { animation: none; }
  }
</style>
</head>
<body>

<div class="app-page">
  <nav class="app-nav">
    <a class="logo" href="01-hero.html">NuCheck</a>
    <div class="step-track">
      <div class="step-track__item step-track__item--done">
        <span class="step-track__circle">✓</span>
        <span class="step-track__label">현재 제품 등록</span>
      </div>
      <span class="step-track__line"></span>
      <div class="step-track__item step-track__item--done">
        <span class="step-track__circle">✓</span>
        <span class="step-track__label">새 제품 등록</span>
      </div>
      <span class="step-track__line"></span>
      <div class="step-track__item step-track__item--active">
        <span class="step-track__circle">3</span>
        <span class="step-track__label">AI 분석</span>
      </div>
      <span class="step-track__line"></span>
      <div class="step-track__item">
        <span class="step-track__circle">4</span>
        <span class="step-track__label">결과 확인</span>
      </div>
    </div>
  </nav>

  <main class="app-main">
    <div class="analyzing" role="status" aria-live="polite">
      <h1 class="analyzing__title">AI가 분석 중이에요</h1>

      <div class="analyzing__visual">
        <svg width="130" height="80" viewBox="0 0 160 90" fill="none">
          <g transform="translate(10 10) rotate(-18 60 30)">
            <path d="M10 30a20 20 0 0 1 20-20h20v40H30a20 20 0 0 1-20-20z" fill="#efeee9" stroke="#c7c5bc"/>
            <path d="M50 10h20a20 20 0 0 1 0 40H50V10z" fill="#dcdad2" stroke="#c7c5bc"/>
          </g>
          <g transform="translate(95 25)">
            <circle cx="25" cy="25" r="24" fill="#f4f3ee" stroke="#c7c5bc"/>
            <line x1="1" y1="25" x2="49" y2="25" stroke="#c7c5bc"/>
          </g>
        </svg>
      </div>

      <p class="analyzing__desc">
        평균 20~40초 정도 소요돼요.<br />
        분석이 완료되면 자동으로 결과 페이지로 이동해요.
      </p>
    </div>
  </main>
</div>

<script>
  // 프로토타입 데모용: 잠시 후 결과 페이지로 자동 이동합니다.
  setTimeout(function () {
    location.href = "10-analysis-result.html";
  }, 2600);
</script>

</body>
</html>
