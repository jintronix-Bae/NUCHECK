<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuCheck — 결과 확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-page">
  <nav class="app-nav">
    <a class="logo" href="01-hero.html">NuCheck</a>
    <div class="step-track">
      <div class="step-track__item step-track__item--done">
        <span class="step-track__circle">✓</span>
        <span class="step-track__label">현재 제품 등록</span>
      </div>
      <span class="step-track__line"></span>
      <div class="step-track__item step-track__item--done">
        <span class="step-track__circle">✓</span>
        <span class="step-track__label">새 제품 등록</span>
      </div>
      <span class="step-track__line"></span>
      <div class="step-track__item step-track__item--done">
        <span class="step-track__circle">✓</span>
        <span class="step-track__label">AI 분석</span>
      </div>
      <span class="step-track__line"></span>
      <div class="step-track__item step-track__item--active">
        <span class="step-track__circle">4</span>
        <span class="step-track__label">결과 확인</span>
      </div>
    </div>
  </nav>

  <main class="app-main app-main--narrow">
    <div class="share-layout">
      <aside class="result-product-card">
        <div class="result-product-card__thumb"><img src="assets/bottle-black.svg" alt="AAC collagen" /></div>
        <h2 class="result-product-card__name">AAC collagen</h2>
        <p class="result-product-card__tag">피부 건강 / 콜라겐</p>
        <div class="result-product-card__divider">
          <p class="result-product-card__label">주요 성분</p>
          <p class="result-product-card__ingredients">
            마그네슘 400mg<br />
            비타민 C 6 1.5mg<br />
            아연 8.5mg
          </p>
        </div>
      </aside>

      <div>
        <h1 class="share-title">분석이 완료되었어요!</h1>
        <p class="share-desc">결과를 저장하거나 공유해 보세요.</p>

        <div class="share-box">
          <span class="share-box__icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 15l6-6M8 17l-2 2a4 4 0 0 1-5.66-5.66l3-3A4 4 0 0 1 9 9M15 7l2-2a4 4 0 0 1 5.66 5.66l-3 3A4 4 0 0 1 15 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <div class="share-box__body">
            <p class="share-box__title">결과 URL 링크 복사</p>
            <p class="share-box__desc">분석 결과 페이지의 링크를 복사해 공유할 수 있어요.</p>
            <div class="url-field">
              <input type="text" readonly value="https://aaverify.com/result/abc123" />
              <button class="btn btn--dark">복사</button>
            </div>
          </div>
        </div>

        <div class="share-box">
          <span class="share-box__icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M7 3h7l4 4v14H7V3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><text x="8" y="16" font-size="6" fill="currentColor">PDF</text></svg>
          </span>
          <div class="share-box__body">
            <p class="share-box__title">결과 이미지 PDF 저장</p>
            <p class="share-box__desc">분석 결과 화면을 이미지로 저장해 PDF 파일로 다운로드할 수 있어요.</p>
            <button class="btn btn--dark btn--block">PDF 저장</button>
          </div>
        </div>

        <div class="app-footer-actions app-footer-actions--split">
          <a class="btn btn--outline" href="10-analysis-result.html">이전 단계</a>
          <a class="btn btn--outline" href="03-step1-empty.html">다른 제품 확인하기</a>
          <a class="btn btn--dark" href="01-hero.html">홈</a>
        </div>
      </div>
    </div>
  </main>
</div>

</body>
</html>
