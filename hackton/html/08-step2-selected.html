<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NuCheck — 새 제품 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-page">
  <nav class="app-nav">
    <a class="logo" href="01-hero.html">NuCheck</a>
    <div class="step-track">
      <div class="step-track__item step-track__item--done">
        <span class="step-track__circle">✓</span>
        <span class="step-track__label">현재 제품 등록</span>
      </div>
      <span class="step-track__line"></span>
      <div class="step-track__item step-track__item--active">
        <span class="step-track__circle">2</span>
        <span class="step-track__label">새 제품 등록</span>
      </div>
      <span class="step-track__line"></span>
      <div class="step-track__item">
        <span class="step-track__circle">3</span>
        <span class="step-track__label">AI 분석</span>
      </div>
      <span class="step-track__line"></span>
      <div class="step-track__item">
        <span class="step-track__circle">4</span>
        <span class="step-track__label">결과 확인</span>
      </div>
    </div>
  </nav>

  <main class="app-main app-main--narrow">
    <h1 class="page-title">선택 제품 및 사전 성분 비교</h1>
    <p class="page-desc">현재 복용 중인 제품과 새로 추가 선택한 제품의 성분 비교 및 중복 여부를 확인하세요.</p>

    <div class="search-bar">
      <input type="text" placeholder="제품명 또는 성분명을 검색하세요." />
      <span class="search-bar__icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
    </div>

    <p class="section-label">새로 선택된 제품 목록</p>

    <div class="selected-card">
      <!-- Dynamically populated from localStorage via ai-analysis.js without images -->
    </div>

    <div class="app-footer-actions app-footer-actions--split">
      <a class="btn btn--outline" href="07-step2-search.html">이전 단계</a>
      <a class="btn btn--dark" href="09-analyzing.html">AI 분석 시작</a>
    </div>
  </main>
</div>

<script src="js/products-data.js"></script>
<script src="js/product-toggle.js"></script>
<script src="js/ai-analysis.js"></script>
</body>
</html>
